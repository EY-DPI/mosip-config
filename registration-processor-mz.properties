# IAM adapter configuration for regproc-workflow running in mz (management zone) profile.
# This file is needed because the mz profile does not inherit registration-processor-default.properties,
# so these critical IAM adapter properties must be explicitly provided here.
# The config-server overrides expose mosip.regproc.client.secret (single-prefix),
# while registration-processor-default.properties uses ${mosip.mosip.regproc.client.secret}
# (double-prefix) which is unresolvable in the mz profile — hence the direct reference below.

mosip.iam.adapter.appid=regproc
mosip.iam.adapter.clientid=mosip-regproc-client
mosip.iam.adapter.clientsecret=${mosip.regproc.client.secret}
mosip.iam.adapter.issuerURL=http://keycloak.mosip.svc.cluster.local:8080/auth/realms/mosip
mosip.iam.adapter.validate-expiry-check-rate=30
mosip.iam.adapter.renewal-before-expiry-interval=30
mosip.iam.adapter.self-token-renewal-enable=true

token.request.issuerUrl=http://keycloak.mosip.svc.cluster.local:8080/auth/realms/mosip
token.request.secretKey=${mosip.regproc.client.secret}
