# kernel-syncdata service configuration for poc-ey-dpi deployment
# spring.application.name = syncdata
# Loaded files: syncdata-default.properties, application-default.properties

## Internal service URLs (Kubernetes ClusterIP DNS)
mosip.kernel.syncdata.auth-manager-base-uri=http://kernel-authmanager.mosip.svc.cluster.local:80/v1/authmanager
mosip.kernel.syncdata-service-idschema-url=http://kernel-masterdata.mosip.svc.cluster.local:80/v1/masterdata/idschema/latest
mosip.kernel.syncdata-service-machine-url=http://kernel-masterdata.mosip.svc.cluster.local:80/v1/masterdata/machines/%s/eng
mosip.kernel.masterdata.locationhierarchylevels.uri=http://kernel-masterdata.mosip.svc.cluster.local:80/v1/masterdata/locationHierarchyLevels
mosip.kernel.masterdata.auth-manager-base-uri=http://kernel-authmanager.mosip.svc.cluster.local:80/v1/authmanager
mosip.kernel.masterdata.auth-user-details=/userdetails
mosip.kernel.masterdata.audit-url=http://kernel-auditmanager.mosip.svc.cluster.local:80/v1/auditmanager/audits
mosip.authmanager.base-url=http://kernel-authmanager.mosip.svc.cluster.local:80/v1/authmanager
mosip.authmanager.client-token-endpoint=http://kernel-authmanager.mosip.svc.cluster.local:80/v1/authmanager/authenticate/clientidsecretkey

## Internal auth token URLs (used by syncdata to validate reg-client tokens)
mosip.kernel.authtoken.NEW.internal.url=http://kernel-authmanager.mosip.svc.cluster.local:80/v1/authmanager/authenticate/internal/useridPwd
mosip.kernel.authtoken.OTP.internal.url=http://kernel-authmanager.mosip.svc.cluster.local:80/v1/authmanager/authenticate/internal/userotp
mosip.kernel.authtoken.REFRESH.internal.url=http://kernel-authmanager.mosip.svc.cluster.local:80/v1/authmanager/authorize/internal/refreshToken/registrationclient
mosip.kernel.auth.sendotp.url=http://kernel-authmanager.mosip.svc.cluster.local:80/v1/authmanager/authenticate/sendotp
mosip.kernel.syncdata.auth-manager-roles=/roles
mosip.kernel.syncdata.auth-user-details=/userdetails

## Keymanager
mosip.kernel.keymanager-service-publickey-url=http://keymanager.mosip.svc.cluster.local:80/v1/keymanager/publickey/{applicationId}
mosip.kernel.keymanager-service-sign-url=http://keymanager.mosip.svc.cluster.local:80/v1/keymanager/jwtSign
mosip.keymanager.base.url=http://keymanager.mosip.svc.cluster.local:80

## IAM / Keycloak (internal)
mosip.iam.base-url=http://keycloak.mosip.svc.cluster.local:8080
keycloak.auth-server-url=http://keycloak.mosip.svc.cluster.local:8080/auth
mosip.iam.open-id-url=http://keycloak.mosip.svc.cluster.local:8080/realms/{realmId}/protocol/openid-connect/
mosip.iam.realm.operations.base-url=http://keycloak.mosip.svc.cluster.local:8080/admin/realms/{realmId}
mosip.iam.admin-url=http://keycloak.mosip.svc.cluster.local:8080/admin/
mosip.iam.authorization_endpoint=http://mosip.internal/auth/realms/{realmId}/protocol/openid-connect/auth
mosip.iam.token_endpoint=http://keycloak.mosip.svc.cluster.local:8080/auth/realms/{realmId}/protocol/openid-connect/token

## IAM adapter (syncdata uses mosip-syncdata-client to get service tokens)
mosip.iam.adapter.clientid=mosip-syncdata-client
mosip.iam.adapter.clientsecret=${mosip.mosip.reg.client.secret}
mosip.iam.adapter.appid=registrationclient
mosip.iam.adapter.issuerURL=http://mosip.internal/auth/realms/mosip
mosip.iam.adapter.validate-expiry-check-rate=15
mosip.iam.adapter.renewal-before-expiry-interval=15
mosip.iam.adapter.self-token-renewal-enable=true

## Token validation — certs endpoint must match issuer host (mosip.internal) to pass domain check
mosip.iam.certs_endpoint=http://mosip.internal/auth/realms/mosip/protocol/openid-connect/certs
auth.server.admin.issuer.uri=http://mosip.internal/auth/realms/
auth.server.admin.issuer.internal.uri=http://keycloak.mosip.svc.cluster.local:8080/auth/realms/
auth.server.admin.oidc.certs.url=http://keycloak.mosip.svc.cluster.local:8080/auth/realms/mosip/protocol/openid-connect/certs

## Database (syncdata reads from mosip_master — hostname from kernel-default.properties)
syncdata_database_url=jdbc:postgresql://postgres-postgresql.mosip.svc.cluster.local:5432/mosip_master
syncdata_database_username=masteruser
syncdata_database_password=${db.dbuser.password}

## Sync config
mosip.kernel.syncdata.syncdata-request-id=SYNCDATA.REQUEST
mosip.kernel.syncdata.syncdata-version-id=v1.0
mosip.kernel.syncdata.registration-center-config-file=registration-${spring.profiles.active}.properties
mosip.kernel.syncdata.global-config-file=application-${spring.profiles.active}.properties
mosip.syncdata.tpm.required=false

## reg-client credentials
mosip.kernel.registrationclient.app.id=registrationclient
mosip.kernel.registrationclient.client.id=mosip-reg-client
mosip.kernel.registrationclient.secret.key=${mosip.mosip.reg.client.secret}

## Websub — all placeholders must be present even when websub is globally disabled
syncdata.websub.topic.ca-cert=CA_CERTIFICATE_UPLOADED
syncdata.websub.callback.secret.ca-cert=secret
syncdata.websub.callback.url.path.ca-cert=/v1/syncdata/websub/callback/cacert
syncdata.websub.callback.url.ca-cert=http://kernel-syncdata.mosip.svc.cluster.local:80/v1/syncdata/websub/callback/cacert
syncdata.websub.resubscription.retry.count=3
syncdata.websub.resubscription.delay.millis=43200000
subscriptions-delay-on-startup=120000

## Identity schema
mosip.ui.spec.default.domain=registration-client

## Cache
syncdata.cache.evict.delta-sync.cron=0 0/15 * * * *
syncdata.cache.snapshot.cron=0 0 23 * * *

## Kernel properties not in application-default (normally from kernel-default.properties)
## syncdata loads only syncdata-default + application-default, so these must be here.
mosip.root.key.applicationid=ROOT
mosip.kernel.certificate.sign.algorithm=SHA256withRSA
mosip.kernel.zkcrypto.masterkey.application.id=KERNEL
mosip.kernel.zkcrypto.masterkey.reference.id=IDENTITY_CACHE
mosip.kernel.zkcrypto.publickey.application.id=IDA
mosip.kernel.zkcrypto.publickey.reference.id=PUBLIC_KEY
mosip.kernel.zkcrypto.wrap.algorithm-name=AES/ECB/NoPadding
mosip.kernel.zkcrypto.derive.encrypt.algorithm-name=AES/ECB/PKCS5Padding
mosip.kernel.partner.sign.masterkey.application.id=PMS
mosip.kernel.partner.allowed.domains=AUTH,DEVICE,FTM
mosip.kernel.partner.issuer.certificate.allowed.grace.duration=300
mosip.kernel.keymanager.autogen.appids.list=ROOT,KERNEL:SIGN,REGISTRATION,REGISTRATION_PROCESSOR,ID_REPO,KERNEL:IDENTITY_CACHE,PMS,ADMIN_SERVICES
mosip.kernel.keymanager.autogen.basekeys.list=RESIDENT:mpartner-default-resident
mosip.kernel.keymanager.keystore.keyreference.enable.cache=true
mosip.kernel.keymanager.certificate.default.common-name=www.mosip.io
mosip.kernel.keymanager.certificate.default.organizational-unit=MOSIP-TECH-CENTER
mosip.kernel.keymanager.certificate.default.organization=MOSIP
mosip.kernel.keymanager.certificate.default.location=TUNISIA
mosip.kernel.keymanager.certificate.default.state=TUNIS
mosip.kernel.keymanager.certificate.default.country=TN
zkcrypto.random.key.generate.count=10000
datastores=db_1_DS,db_2_DS

## Roles
mosip.role.admin.syncdata.getclientsettings=REGISTRATION_SUPERVISOR,REGISTRATION_OFFICER,REGISTRATION_ADMIN,default
mosip.role.admin.syncdata.getpublickeyapplicationid=REGISTRATION_SUPERVISOR,REGISTRATION_OFFICER,REGISTRATION_ADMIN,default
mosip.role.admin.syncdata.gettpmpublickeyverify=REGISTRATION_SUPERVISOR,REGISTRATION_OFFICER,REGISTRATION_ADMIN,default
mosip.role.admin.syncdata.getlatestidschema=REGISTRATION_SUPERVISOR,REGISTRATION_OFFICER,REGISTRATION_ADMIN,default,PRE_REGISTRATION_ADMIN,REGISTRATION_PROCESSOR,INDIVIDUAL,RESIDENT,ID_AUTHENTICATION
mosip.role.admin.syncdata.getgetcertificate=REGISTRATION_SUPERVISOR,REGISTRATION_OFFICER,REGISTRATION_ADMIN,default
mosip.role.admin.syncdata.gettpmpublickeymachineid=REGISTRATION_SUPERVISOR,REGISTRATION_OFFICER,REGISTRATION_ADMIN,default,REGISTRATION_PROCESSOR
mosip.role.admin.syncdata.getconfigskeyIndex=REGISTRATION_SUPERVISOR,REGISTRATION_OFFICER,REGISTRATION_ADMIN,default
mosip.role.admin.syncdata.getuserdetails=REGISTRATION_SUPERVISOR,REGISTRATION_OFFICER,REGISTRATION_ADMIN,default
mosip.role.admin.syncdata.getgetcacertificates=REGISTRATION_SUPERVISOR,REGISTRATION_OFFICER,REGISTRATION_ADMIN,default
mosip.role.admin.syncdata.getv2clientsettings=REGISTRATION_SUPERVISOR,REGISTRATION_OFFICER,REGISTRATION_ADMIN,default
mosip.role.admin.syncdata.getclientsettingsentityIdentifier=REGISTRATION_SUPERVISOR,REGISTRATION_OFFICER,default
mosip.role.admin.syncdata.getscriptsscriptName=REGISTRATION_SUPERVISOR,REGISTRATION_OFFICER,default
