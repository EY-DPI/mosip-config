# ── OIDC endpoints (absolute URLs for external browser access) ────────────────
mosip.admin-services.open-id.token_endpoint=http://192.168.1.101:30280/auth/realms/mosip/protocol/openid-connect/token
mosip.admin-services.open-id.authorization_endpoint=http://192.168.1.101:30280/auth/realms/mosip/protocol/openid-connect/auth
mosip.admin-services.open-id.introspection_endpoint=http://192.168.1.101:30280/auth/realms/mosip/protocol/openid-connect/token/introspect
mosip.admin-services.redirecturi=http://192.168.1.101:30188/v1/admin/login-redirect/
mosip.admin-services.logout_endpoint=http://192.168.1.101:30280/auth/realms/mosip/protocol/openid-connect/logout
mosip.admin-services.client_id=mosip-admin-client
mosip.admin-services.client_secret=${mosip.admin.client.secret}
mosip.admin-services.realm_id=mosip
mosip.admin-services.cookie.security=false
mosip.admin.ui.base.url=http://192.168.1.101:30088

# ── IAM properties (normally from kernel-default.properties) ──────────────────
mosip.iam.base-url=http://192.168.1.101:30280
auth.server.validate.base-url=http://192.168.1.101:30280
mosip.iam.admin-realm-id=admin
mosip.iam.default.realm-id=mosip
mosip.iam.open-id-url=http://192.168.1.101:30280/auth/realms/{realmId}/protocol/openid-connect/
mosip.iam.admin-url=http://192.168.1.101:30280/auth/admin/
mosip.iam.token_endpoint=http://192.168.1.101:30280/auth/realms/{realmId}/protocol/openid-connect/token
mosip.iam.adapter.appid=admin
mosip.iam.adapter.clientid=mosip-admin-client
mosip.iam.adapter.clientsecret=${mosip.admin.client.secret}
mosip.admin.clientid=mosip-admin-client
mosip.admin.clientsecret=${mosip.admin.client.secret}
mosip.admin_realm_id=mosip
mosip.iam.master.realm-id=master
mosip.keycloak.admin.client.id=admin-cli
mosip.keycloak.admin.user.id=admin
mosip.keycloak.admin.secret.key=${keycloak.admin.password}

# ── Disable mail health indicator to fix 503 ─────────────────────────────────
management.health.mail.enabled=false

mosip.security.secure-cookie=false
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.http-only=false

mosip.security.cors-enable=true
mosip.security.origins=http://192.168.1.101:30088,http://192.168.1.101:30280,http://192.168.1.101:30188
admin.allowed.audience=mosip-admin-client
mosip.admin.allowed.urls=http://192.168.1.101:30088,http://192.168.1.101:30188
auth.allowed.urls=*

# The redirect_uri sent during OAuth2 code exchange — must match exactly what was used in the auth request
mosip.admin.redirecturi=http://192.168.1.101:30188/v1/admin/login-redirect/

# Fix the broken placeholder chain for mosipbox.public.url
mosip.api.internal.url=http://192.168.1.101:30188
mosipbox.public.url=http://192.168.1.101:30188

# Ensure authmanager is reachable from admin-service pod
mosip.kernel.authmanager.url==http://kernel-authmanager.mosip.svc.cluster.local:80/v1/authmanager