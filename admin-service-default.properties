# ── OIDC endpoints (absolute URLs for external browser access) ────────────────
mosip.admin-services.open-id.token_endpoint=http://mosip.internal/auth/realms/mosip/protocol/openid-connect/token
mosip.admin-services.open-id.authorization_endpoint=http://mosip.internal/auth/realms/mosip/protocol/openid-connect/auth
mosip.admin-services.open-id.introspection_endpoint=http://mosip.internal/auth/realms/mosip/protocol/openid-connect/token/introspect
mosip.admin-services.redirecturi=http://mosip.internal/v1/admin/login-redirect/
mosip.admin-services.logout_endpoint=http://mosip.internal/auth/realms/mosip/protocol/openid-connect/logout
mosip.admin-services.client_id=mosip-admin-client
mosip.admin-services.client_secret=${mosip.admin.client.secret}
mosip.admin-services.realm_id=mosip
mosip.admin-services.cookie.security=false
mosip.admin.ui.base.url=http://mosip.internal
mosip.admin.ui.redirect.url=http://mosip.internal/
mosip.admin.ui.redirect.uri=http://mosip.internal/
mosip.admin.redirectui=http://mosip.internal/

# ── IAM properties (normally from kernel-default.properties) ──────────────────
mosip.iam.base-url=http://mosip.internal
auth.server.validate.base-url=http://mosip.internal
mosip.iam.admin-realm-id=admin
mosip.iam.default.realm-id=mosip
mosip.iam.open-id-url=http://mosip.internal/auth/realms/{realmId}/protocol/openid-connect/
mosip.iam.admin-url=http://mosip.internal/auth/admin/
mosip.iam.token_endpoint=http://mosip.internal/auth/realms/{realmId}/protocol/openid-connect/token
mosip.iam.adapter.appid=admin
mosip.iam.adapter.clientid=mosip-admin-client
mosip.iam.adapter.clientsecret=${mosip.admin.client.secret}
mosip.admin.clientid=mosip-admin-client
mosip.admin.clientsecret=${mosip.admin.client.secret}
mosip.admin_realm_id=mosip
mosip.iam.master.realm-id=master
mosip.keycloak.admin.client.id=admin-cli
mosip.keycloak.admin.user.id=admin
mosip.keycloak.admin.secret.key=${keycloak.admin.password}

# ── Disable mail health indicator to fix 503 ─────────────────────────────────
management.health.mail.enabled=false

mosip.security.secure-cookie=false
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.http-only=false

mosip.security.cors-enable=true
mosip.security.origins=http://mosip.internal,http://mosip.internal/*
admin.allowed.audience=mosip-admin-client
mosip.admin.allowed.urls=http://mosip.internal
auth.allowed.urls=*

# The redirect_uri sent during OAuth2 code exchange — must match exactly what was used in the auth request
mosip.admin.redirecturi=http://mosip.internal/v1/admin/login-redirect/
mosip.admin-services.redirecturi=http://mosip.internal/v1/admin/login-redirect/

# Fix the broken placeholder chain for mosipbox.public.url
mosip.api.internal.url=http://mosip.internal
mosipbox.public.url=http://mosip.internal

# Ensure authmanager is reachable from admin-service pod
mosip.kernel.authmanager.url=http://kernel-authmanager.mosip.svc.cluster.local:80/v1/authmanager

# JWKS endpoint — use internal Keycloak to avoid ingress round-trip on every token validation
mosip.iam.certs_endpoint=http://keycloak.mosip.svc.cluster.local:8080/auth/realms/mosip/protocol/openid-connect/certs

# Issuer URI must match the iss claim Keycloak puts in tokens (= KEYCLOAK_FRONTEND_URL/realms/mosip)
auth.server.admin.issuer.uri=http://mosip.internal/auth/realms/mosip
# Internal token fetch — realmId appended by TokenHelper
auth.server.admin.issuer.internal.uri=http://keycloak.mosip.svc.cluster.local:8080/auth/realms/
# Explicit JWKS URL (internal) — bypasses broken issuerUri+realmId concatenation in ValidateTokenHelper
auth.server.admin.oidc.certs.url=http://keycloak.mosip.svc.cluster.local:8080/auth/realms/mosip/protocol/openid-connect/certs
